services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/bukutamu?schema=public
      - MASTER_PIN_HASH=${MASTER_PIN_HASH}
      - NAS_MOUNT_PATH=/app/uploads
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - SESSION_SECRET=${SESSION_SECRET:-change-this-to-a-random-secret-string}
      - SESSION_DURATION_HOURS=${SESSION_DURATION_HOURS:-8}
    volumes:
      - ${NAS_MOUNT_PATH:-./uploads}:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:15-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bukutamu
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
